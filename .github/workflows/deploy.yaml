name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/desmitry/charisma-master

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          secrets: GITHUB_TOKEN
          envs: GITHUB_TOKEN
          debug: true
          script: |
            set -e
            cd charisma-master

            git pull origin main

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            export API_GATEWAY_IMAGE=${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.event.workflow_run.head_sha }}
            export ML_WORKER_IMAGE=${{ env.IMAGE_PREFIX }}-ml-worker:${{ github.event.workflow_run.head_sha }}
            export ACCOUNT_IMAGE=${{ env.IMAGE_PREFIX }}-account:${{ github.event.workflow_run.head_sha }}
            export FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-frontend:${{ github.event.workflow_run.head_sha }}
            export MIGRATOR_IMAGE=${{ env.IMAGE_PREFIX }}-migrator:${{ github.event.workflow_run.head_sha }}

            docker compose pull api_gateway ml_worker account frontend migrator
            docker compose up account account-health api_gateway frontend migrator ml_worker nats postgres redis seaweedfs-s3 --no-build --wait

            if docker compose ps --format "{{.Status}}" | grep -q unhealthy; then echo "Unhealthy container detected"; exit 1; fi