name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/desmitry/charisma-master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check --config ./pyproject.toml

      - name: Run ruff format check
        run: ruff format --check --config ./pyproject.toml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy, rustfmt
          profile: minimal

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "rust-lint"
      
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Rust fmt & clippy
        run: |
          cargo fmt --manifest-path services/account/Cargo.toml -- --check
          cargo fmt --manifest-path services/migrator/Cargo.toml -- --check

          cargo clippy --manifest-path services/account/Cargo.toml -- -D warnings
          cargo clippy --manifest-path services/migrator/Cargo.toml -- -D warnings

  release:
    runs-on: ubuntu-latest
    needs: [test-python, test-account]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          uvx --from python-semantic-release semantic-release version --no-commit
          version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

  test-python:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Run tests
        run: uv run pytest

  test-account:
    name: Test Account Service
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./services/account/

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: charisma_master
          POSTGRES_PASSWORD: test_password_for_ci
          POSTGRES_DB: charisma_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.94"

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "rust-account"

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          until PGPASSWORD=test_password_for_ci psql -h localhost -U charisma_master -d charisma_master_test -c '\q'; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        env:
          SQLX_OFFLINE: "true"
        run: |
          export DATABASE_URL="postgresql://charisma_master:test_password_for_ci@localhost:5432/charisma_master_test"
          export SQLX_MIGRATIONS="$PWD/../migrator/migrations"
          cargo test --lib --verbose
          cargo test --test repository_tests --verbose

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-python, test-account, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api_gateway/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api-gateway:latest
            ${{ env.IMAGE_PREFIX }}-api-gateway:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push custom certbot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/nginx/certbot.Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-certbot:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-certbot:latest
            ${{ env.IMAGE_PREFIX }}-certbot:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/ml_worker/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-ml-worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-ml-worker:latest
            ${{ env.IMAGE_PREFIX }}-ml-worker:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push migrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/migrator/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-migrator:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-migrator:latest
            ${{ env.IMAGE_PREFIX }}-migrator:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push account service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/account/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-account:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-account:latest
            ${{ env.IMAGE_PREFIX }}-account:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max