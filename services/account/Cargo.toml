[package]
name = "account"
version = "0.1.0"
edition = "2021"

[lib]
name = "account_service"
path = "src/lib.rs"

[[bin]]
name = "account"
path = "src/main.rs"
test = false

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }
serde = "1.0.228"
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
rust_common = { path = "../../packages/rust_common" }
thiserror = "2.0.17"
async-trait = "0.1.89"
regex = "1.11.3"
prost = "0.14.1"
prost-types = "0.14.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "signal", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-nats = "0.46.0"
bcrypt = "0.18.0"
futures = "0.3.31"
actix-web = "4"

[build-dependencies]
prost-build = "0.14.1"

[dev-dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
