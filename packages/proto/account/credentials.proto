syntax = "proto3";
package account.credentials;

import "common.proto";

// Credential operations: verify password, update password.

// VERIFY CREDENTIALS

message VerifyRequest {
  string email = 1;
  string password = 2;
}

message VerifySuccess {
  string id = 1;
}

message VerifyResponse {
  oneof result {
    VerifySuccess success = 1;
    common.InvalidCredentialsError invalid_credentials = 2;
    common.InternalError internal = 3;
  }
}

// UPDATE PASSWORD

message UpdatePasswordRequest {
  string id = 1;
  string old_password = 2;
  string new_password = 3;
}

message UpdatePasswordSuccess {}

message UpdatePasswordResponse {
  oneof result {
    UpdatePasswordSuccess success = 1;
    common.InvalidPasswordError invalid_password = 2;
    common.UserNotFoundError user_not_found = 3;
    common.InternalError internal = 4;
  }
}
