[package]
name = "rust_common"
version = "0.1.0"
edition = "2021"

[dependencies]
async-nats = "0.46.0"
futures = "0.3.31"
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0.17"
prost = "0.14.1"
prost-types = "0.14.1"

[build-dependencies]
prost-build = "0.14.1"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "test-util"] }
